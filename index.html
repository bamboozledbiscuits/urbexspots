  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {

      easy:'Makkelijk',medium:'Gemiddeld',hard:'Moeilijk',unknown:'Onbekend',
      visited:'Bezocht',notVisited:'Niet bezocht',alreadyVisited:'Al bezocht?',visHint:'Zet uit als je hier nog niet bent geweest',
      sortAZ:'Sorteren: A–Z',sortNearest:'Sorteren: Dichtstbij eerst',sortFarthest:'Sorteren: Verst eerst',
      sortEasy:'Sorteren: Makkelijk → Moeilijk',sortHard:'Sorteren: Moeilijk → Makkelijk',
      filterNotVisited:'Filter: Niet bezocht',filterVisited:'Filter: Bezocht',filterWorth:'Filter: De moeite waard',
      langToggle:'EN',menuLang:'Taal',menuThemeLight:'Lichte modus',menuThemeDark:'Donkere modus',menuLogout:'Uitloggen',
      addNewSpot:'Nieuwe spot toevoegen',dangerZone:'Gevarenzone',deleteSpot:'Spot Verwijderen',
      viewSpot:'Bekijk spot',
      hc:n=>`${n} gevaren`,pc:n=>`${n} foto${n>1?"'s":''} geselecteerd`,
      dist:d=>d<1?`${Math.round(d*1000)} m verwijderd`:`${d.toFixed(1)} km verwijderd`,
    }
  }
  let lang=localStorage.getItem('lang')||'en'
  let theme=localStorage.getItem('theme')||'dark'
  let allSpots=[]
  let thumbFile=null,photoFiles=[],editingId=null
  let existingThumbUrl=null,existingPhotoUrls=[]
  let userLat=null,userLng=null
  let leafMap=null,mapInited=false,currentTab='list'
  let currentSort='name',activeFilter=null

  function t(k,...a){const v=T[lang][k];return typeof v==='function'?v(...a):(v!==undefined?v:k)}
  function setTxt(id,txt){const e=document.getElementById(id);if(e)e.textContent=txt}
  function setOpt(id,txt){const e=document.getElementById(id);if(e)e.textContent=txt}

  function applyLang(){
    setTxt('menu-lang', t('langToggle'))
    setTxt('menu-theme', theme==='dark' ? t('menuThemeLight') : t('menuThemeDark'))
    setTxt('menu-logout', t('menuLogout'))
    setTxt('tab-list-lbl', t('tabSpots'))
    setTxt('tab-map-lbl', t('tabMap'))
    setTxt('ftitle', editingId ? t('editSpot') : t('addSpot'))
    const sbar=document.getElementById('sbar'); if(sbar) sbar.placeholder=t('search')
    setTxt('gpslbl', t('useGPS'))
    setTxt('h-cancel', t('cancel'))
    setTxt('d-back', t('back'))
    setTxt('fsv', t('save'))
    setOpt('so-name', t('sortAZ')); setOpt('so-dist', t('sortNearest')); setOpt('so-dist-far', t('sortFarthest'))
    setOpt('so-easy', t('sortEasy')); setOpt('so-hard', t('sortHard'))
    setOpt('so-nv', t('filterNotVisited')); setOpt('so-v', t('filterVisited')); setOpt('so-worth', t('filterWorth'))
    document.querySelectorAll('[data-flag]').forEach(b=>{ const k=b.dataset.flag; if(k) b.textContent=t(k) })
    setTxt('te', t('easy')); setTxt('tm', t('medium')); setTxt('th2', t('hard')); setTxt('tunk', t('unknown'))
    setTxt('fl-vis', t('alreadyVisited')); setTxt('vis-hint', t('visHint'))
    if(!thumbFile && !existingThumbUrl){ setTxt('th-lbl', t('pickThumb')); setTxt('th-sub', t('thumbSub')) }
    if(!photoFiles.length && !existingPhotoUrls.length){ setTxt('ph-lbl', t('addPhotos')); setTxt('ph-sub', t('photosSub')) }
    document.querySelector('.danger-zone-title').textContent = '⚠️ ' + t('dangerZone')
    document.querySelector('#danger-zone .btn-danger').textContent = t('deleteSpot')
    if(allSpots.length) filterSpots()
    if(mapInited) refreshMapMarkers()
  }

  function toggleLang(){ lang=lang==='en'?'nl':'en'; localStorage.setItem('lang',lang); applyLang() }
  function applyTheme(){ document.documentElement.setAttribute('data-theme',theme==='light'?'light':'') }
  function toggleTheme(){ theme=theme==='dark'?'light':'dark'; localStorage.setItem('theme',theme); applyTheme(); if(mapInited) applyMapTheme(); applyLang() }

  function toggleSettingsMenu(){ document.getElementById('settings-dropdown').classList.toggle('open') }
  document.addEventListener('click',(e)=>{ if(!e.target.closest('.settings-btn')) document.getElementById('settings-dropdown').classList.remove('open') })

  document.addEventListener('DOMContentLoaded',async()=>{
    applyTheme(); applyLang()
    if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p=>{userLat=p.coords.latitude;userLng=p.coords.longitude; document.getElementById('so-dist').style.display=''; document.getElementById('so-dist-far').style.display=''},()=>{})
    const {data:{session}}=await sb.auth.getSession()
    document.getElementById('loader').classList.add('out')
    if(session) showListTab()
    else showScreen('login')
    document.getElementById('lpw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()})
  })

  function showScreen(name){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById('screen-'+name).classList.add('active'); window.scrollTo(0,0)}
  function showListTab(){showScreen('list'); switchTab(currentTab); loadSpots()}
  function showAdd(id){editingId=id; resetForm(); if(id) fillForm(id); else {applyLang(); showScreen('add')}}

  function switchTab(tab){
    currentTab=tab
    document.getElementById('tab-list').classList.toggle('active',tab==='list')
    document.getElementById('tab-map').classList.toggle('active',tab==='map')
    document.getElementById('list-tab').style.display=tab==='list'?'block':'none'
    document.getElementById('map-tab').classList.toggle('active',tab==='map')
    if(tab==='map') initMap()
  }

  function onSortChange(val){currentSort=val; activeFilter=null; if(val==='visited'||val==='notvisited'||val==='worth') activeFilter=val; filterSpots()}

  function initMap(){
    if(mapInited){refreshMapMarkers();return}
    mapInited=true
    const center=userLat?[userLat,userLng]:[51.05,4.35]
    leafMap=L.map('map').setView(center,userLat?10:7)
    L.tileLayer(theme==='light'?'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png':'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',maxZoom:19}).addTo(leafMap)
    refreshMapMarkers()
  }
  function applyMapTheme(){
    if(!leafMap)return
    leafMap.eachLayer(l=>{if(l._url)leafMap.removeLayer(l)})
    L.tileLayer(theme==='light'?'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png':'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',maxZoom:19}).addTo(leafMap)
  }

  function markerColor(entrance){
    const e = (entrance||'').toLowerCase();
    if (e === 'easy') return '#4aaf6e';
    if (e === 'hard') return '#e05555';
    if (e === 'unknown') return '#888';
    return '#e8a840';
  }

  function makeIcon(color, visited, isWorthIt) {
    if (isWorthIt) {
      const cross = visited
        ? '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#000;line-height:1;z-index:1">✕</div>'
        : '';
      const html = `<div style="position:relative;width:32px;height:32px;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:28px;color:${color};text-shadow:-1px 0 #fff,0 1px #fff,1px 0 #fff,0 -1px #fff;filter:drop-shadow(0 0 4px ${color}66);">★</span>
        ${cross}
      </div>`;
      return L.divIcon({ className:'', html, iconSize:[28,28], iconAnchor:[14,14], popupAnchor:[0,-16] });
    } else {
      const cross = visited
        ? '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#000;line-height:1">✕</div>'
        : '';
      return L.divIcon({ className:'', html:`<div style="width:14px;height:14px;background:${color};border-radius:50%;border:2.5px solid rgba(255,255,255,.85);box-shadow:0 0 10px ${color}44;position:relative">${cross}</div>`, iconSize:[16,16], iconAnchor:[8,8], popupAnchor:[0,-10] });
    }
  }

  function refreshMapMarkers(){
    if(!leafMap)return
    leafMap.eachLayer(l=>{if(l instanceof L.Marker)leafMap.removeLayer(l)})
    allSpots.forEach(spot=>{
      if(!spot.latitude||!spot.longitude)return
      const color = markerColor(spot.entrance)
      const marker = L.marker([spot.latitude, spot.longitude], { icon: makeIcon(color, spot.visited, spot.worth_it) })
      const mapsUrl=`https://maps.google.com/?q=${spot.latitude},${spot.longitude}`
      marker.bindPopup(`<div class="mpname">${esc(spot.name)}</div><div class="mpbtns"><button class="mpbtn mpbtn-view" onclick="showDetail('${spot.id}')">${t('viewSpot')}</button><a class="mpbtn mpbtn-maps" href="${mapsUrl}" target="_blank">${t('openMaps')}</a></div>`)
      marker.addTo(leafMap)
    })
  }

  async function doLogin(){
    const pw=document.getElementById('lpw').value, btn=document.getElementById('lbtn'),err=document.getElementById('lerr')
    btn.disabled=true; btn.textContent='...'; err.style.display='none'
    const {error}=await sb.auth.signInWithPassword({email:'admin@urbex.app',password:pw})
    if(error){err.style.display='block'; btn.disabled=false; btn.textContent=t('ebtn')} else showListTab()
  }
  async function doLogout(){await sb.auth.signOut();showScreen('login');document.getElementById('lpw').value=''}

  async function loadSpots(){
    document.getElementById('scount').textContent='...'; document.getElementById('slist').innerHTML=''
    const {data:{session}}=await sb.auth.getSession(); if(!session){showScreen('login');return}
    const {data,error}=await sb.from('spots').select('*').order('name',{ascending:true})
    if(error){toast(t('errLoad'),'err');return}
    allSpots=data; filterSpots(); if(mapInited)refreshMapMarkers()
  }

  function haversine(lat1,lng1,lat2,lng2){const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}

  function filterSpots(){
    const q=(document.getElementById('sbar').value||'').toLowerCase()
    let data=allSpots.filter(s=>s.name.toLowerCase().includes(q)||(s.description||'').toLowerCase().includes(q))
    if(activeFilter==='visited')data=data.filter(s=>s.visited)
    if(activeFilter==='notvisited')data=data.filter(s=>!s.visited)
    if(activeFilter==='worth')data=data.filter(s=>s.worth_it)
    const entOrd={easy:0,medium:1,hard:2,unknown:99},entVal=e=>entOrd[(e||'unknown').toLowerCase()]??99
    if(currentSort==='name')data=[...data].sort((a,b)=>a.name.localeCompare(b.name))
    else if(currentSort==='dist'&&userLat)data=[...data].sort((a,b)=>{const da=a.latitude?haversine(userLat,userLng,a.latitude,a.longitude):99999,db=b.latitude?haversine(userLat,userLng,b.latitude,b.longitude):99999;return da-db})
    else if(currentSort==='dist-far'&&userLat)data=[...data].sort((a,b)=>{const da=a.latitude?haversine(userLat,userLng,a.latitude,a.longitude):0,db=b.latitude?haversine(userLat,userLng,b.latitude,b.longitude):0;return db-da})
    else if(currentSort==='easy')data=[...data].sort((a,b)=>entVal(a.entrance)-entVal(b.entrance))
    else if(currentSort==='hard')data=[...data].sort((a,b)=>{const av=entVal(a.entrance),bv=entVal(b.entrance);if(av===99&&bv!==99)return 1;if(bv===99&&av!==99)return-1;return bv-av})
    renderSpots(data)
  }

  function renderSpots(data){
    const el=document.getElementById('slist'),count=document.getElementById('scount')
    const hazKeys=['mold','still_water','active_cameras','asbestos','hobos','broken_glass']
    count.textContent=`${data.length} ${data.length===1?t('spot'):t('spots')} ${t('tracked')}`
    el.innerHTML=''
    if(!data.length){
      const q=document.getElementById('sbar').value
      el.innerHTML=`<div class="empty"><div class="empty-t">${q||activeFilter?'…':t('noSpots')}</div><p>${q||activeFilter?t('noMatch'):t('addFirst')}</p></div>`
      el.innerHTML += `<div class="add-spot-card" onclick="showAdd(null)"><span class="plus-icon">+</span><span class="add-text">${t('addNewSpot')}</span></div>`
      return
    }
    data.forEach((spot,i)=>{
      const haz=hazKeys.filter(f=>spot[f]),ec='b-'+(spot.entrance?spot.entrance.toLowerCase():'unknown')
      const thumb=spot.thumbnail_url?`<img class="sthumb" src="${spot.thumbnail_url}" alt="${esc(spot.name)}" loading="lazy">`:`<div class="snothumb">▲</div>`
      let distHTML=''
      if(userLat&&spot.latitude&&spot.longitude){const d=haversine(userLat,userLng,spot.latitude,spot.longitude);distHTML=`<span class="dist">${t('dist',d)}</span>`}
      const visitedBadge=spot.visited?`<span class="badge b-visited">✓ ${t('visited')}</span>`:''
      const card=document.createElement('div')
      card.className='spot-card'+(spot.visited?' visited':'')
      card.style.animationDelay=(i*0.04)+'s'
      card.innerHTML=`<div class="card-top" onclick="showDetail('${spot.id}')">${thumb}<div class="sbody"><div class="sname">${esc(spot.name)}</div><div class="smeta">${spot.entrance?`<span class="badge ${ec}">${t(spot.entrance.toLowerCase())}</span>`:''}${haz.length?`<span class="haz">${t('hc',haz.length)}</span>`:''}${spot.worth_it?`<span class="badge" style="background:var(--accent-soft);color:var(--accent);border:1px solid rgba(232,168,64,.25);font-weight:600">★ ${t('worth_it')}</span>`:''}${visitedBadge}${distHTML}</div></div></div>`
      el.appendChild(card)
    })
    const addCard = document.createElement('div')
    addCard.className = 'add-spot-card'
    addCard.onclick = () => showAdd(null)
    addCard.innerHTML = `<span class="plus-icon">+</span><span class="add-text">${t('addNewSpot')}</span>`
    el.appendChild(addCard)
  }

  async function showDetail(id){
    showScreen('detail'); const el=document.getElementById('dcontent')
    el.innerHTML='<div style="padding:50px 0;text-align:center;font-family:var(--fm);font-size:11px;color:var(--text2)">...</div>'
    const {data:spot,error}=await sb.from('spots').select('*').eq('id',id).single()
    if(error||!spot){el.innerHTML='<p style="color:var(--danger);padding:20px">Not found.</p>';return}
    const hazKeys=['mold','still_water','active_cameras','asbestos','hobos','broken_glass'],photos=Array.isArray(spot.photos)?spot.photos:[]
    const mapsUrl=`https://maps.google.com/?q=${spot.latitude},${spot.longitude}`
    const wStyle = spot.worth_it ? 'background:var(--accent);color:#0b0b0f;padding:9px 16px;border-radius:18px;display:inline-block;font-family:var(--fm);font-weight:700;font-size:10px;letter-spacing:2px;text-transform:uppercase' : 'background:var(--bg3);color:var(--border);padding:9px 16px;border-radius:18px;display:inline-block;font-family:var(--fm);font-weight:700;font-size:10px;letter-spacing:2px;text-transform:uppercase'
    el.innerHTML=`
      ${spot.thumbnail_url?`<img class="detail-hero" src="${esc(spot.thumbnail_url)}" alt="${esc(spot.name)}">`:''}
      <div class="dtitle">${esc(spot.name)}</div>
      ${spot.visited?`<span class="badge b-visited" style="display:inline-block;margin-bottom:10px">✓ ${t('visited')}</span>`:''}
      ${spot.description?`<div class="ddesc">${esc(spot.description)}</div>`:''}
      <div class="sec">${t('loc')}</div>
      <a class="clnk" href="${mapsUrl}" target="_blank"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg> ${spot.latitude}, ${spot.longitude} — ${t('openMaps')}</a>
      <div class="sec">${t('entLbl')}</div>
      <span class="badge b-${(spot.entrance||'unknown').toLowerCase()}" style="display:inline-block;margin-top:2px">${t((spot.entrance||'unknown').toLowerCase())}</span>
      <div class="sec">${t('worth_it')}</div>
      <span style="${wStyle}">${spot.worth_it?'✓ '+t('worth_it'):'✗ '+t('worth_it')}</span>
      <div class="sec">${t('hazLbl')}</div>
      <div class="fwrap">${hazKeys.map(k=>`<span class="fp ${spot[k]?'on':'off'}">${t(k)}</span>`).join('')}</div>
      ${photos.length?`<div class="sec">${t('phLbl')}</div><div class="pgrid">${photos.map(u=>`<img src="${u}" loading="lazy" onclick="openLB('${u}')">`).join('')}</div>`:''}
      <div class="dacts">
        <button class="abt" onclick="showAdd('${spot.id}')">${t('edit')}</button>
      </div>
    `
  }

  async function doDel(id){if(!confirm(t('confirmDel')))return;const {error}=await sb.from('spots').delete().eq('id',id);if(error){toast(t('errDel'),'err');return}toast(t('deleted'),'ok');showListTab()}

  function resetForm(){
    document.getElementById('fsv').disabled=false; setTxt('fsv',t('save'))
    ;['f-name','f-desc','f-lat','f-lng'].forEach(id=>document.getElementById(id).value='')
    document.getElementById('th-prev').innerHTML=''; document.getElementById('ph-prev').innerHTML=''
    setTxt('th-lbl',t('pickThumb')); setTxt('th-sub',t('thumbSub'))
    setTxt('ph-lbl',t('addPhotos')); setTxt('ph-sub',t('photosSub'))
    document.querySelectorAll('[data-grp="ent"]').forEach(b=>b.classList.toggle('on',b.dataset.val==='Medium'))
    document.querySelectorAll('[data-flag]').forEach(b=>b.classList.remove('on'))
    document.querySelector('[data-flag="visited"]').classList.add('on')
    thumbFile=null; photoFiles=[]; existingThumbUrl=null; existingPhotoUrls=[]
    document.getElementById('danger-zone').style.display = 'none'
    applyLang()
  }

  async function fillForm(id){
    const {data:spot}=await sb.from('spots').select('*').eq('id',id).single(); if(!spot){showListTab();return}
    document.getElementById('f-name').value=spot.name||''; document.getElementById('f-desc').value=spot.description||''
    document.getElementById('f-lat').value=spot.latitude||''; document.getElementById('f-lng').value=spot.longitude||''
    document.querySelectorAll('[data-grp="ent"]').forEach(b=>b.classList.toggle('on',b.dataset.val===(spot.entrance||'Medium')))
    ;['mold','still_water','active_cameras','asbestos','hobos','worth_it','broken_glass','visited'].forEach(k=>{document.querySelector(`[data-flag="${k}"]`).classList.toggle('on',!!spot[k])})
    existingThumbUrl=spot.thumbnail_url||null; existingPhotoUrls=Array.isArray(spot.photos)?spot.photos:[]
    if(existingThumbUrl){ setTxt('th-lbl',t('thumb')+' (existing)'); document.getElementById('th-prev').innerHTML=`<div class="pgv"><div class="pi"><img src="${existingThumbUrl}"><button class="prm" onclick="rmExThumb()">×</button></div></div>` }
    if(existingPhotoUrls.length) renderExPhotos()
    setTxt('ftitle',t('editSpot'))
    document.getElementById('danger-zone').style.display = 'block'
    applyLang(); showScreen('add')
  }

  function confirmDeleteSpot(){ if(editingId) doDel(editingId) }

  function rmExThumb(){existingThumbUrl=null; document.getElementById('th-prev').innerHTML=''; setTxt('th-lbl',t('pickThumb'))}
  function renderExPhotos(){const g=document.getElementById('ph-prev');g.innerHTML='';existingPhotoUrls.forEach((url,i)=>{const item=document.createElement('div');item.className='pi';item.innerHTML=`<img src="${url}"><button class="prm" onclick="rmExPhoto(${i})">×</button>`;g.appendChild(item)});renderNewPreviews()}
  function rmExPhoto(i){existingPhotoUrls.splice(i,1);renderExPhotos()}
  function pickTog(btn){document.querySelectorAll(`[data-grp="${btn.dataset.grp}"]`).forEach(b=>b.classList.remove('on'));btn.classList.add('on')}
  function flipF(btn){btn.classList.toggle('on')}
  function onThumb(inp){if(!inp.files[0])return;thumbFile=inp.files[0];setTxt('th-lbl',thumbFile.name);const r=new FileReader();r.onload=e=>{document.getElementById('th-prev').innerHTML=`<div class="pgv"><div class="pi"><img src="${e.target.result}"><button class="prm" onclick="rmThumb()">×</button></div></div>`};r.readAsDataURL(thumbFile)}
  function rmThumb(){thumbFile=null;document.getElementById('th-prev').innerHTML='';setTxt('th-lbl',t('pickThumb'));document.getElementById('fi-th').value=''}
  function onPhotos(inp){photoFiles=[...photoFiles,...Array.from(inp.files)];renderNewPreviews()}
  function renderNewPreviews(){const g=document.getElementById('ph-prev');g.querySelectorAll('.new-pi').forEach(e=>e.remove());const total=existingPhotoUrls.length+photoFiles.length;setTxt('ph-lbl',total>0?t('pc',total):t('addPhotos'));photoFiles.forEach((file,i)=>{const r=new FileReader();r.onload=e=>{const item=document.createElement('div');item.className='pi new-pi';item.innerHTML=`<img src="${e.target.result}"><button class="prm" onclick="rmNewPhoto(${i})">×</button>`;g.appendChild(item)};r.readAsDataURL(file)})}
  function rmNewPhoto(i){photoFiles.splice(i,1);renderNewPreviews()}
  function useGPS(){const btn=document.getElementById('gpsbtn');if(!navigator.geolocation){toast(t('errGPS'),'err');return}btn.disabled=true;setTxt('gpslbl',t('gpsWait'));navigator.geolocation.getCurrentPosition(p=>{document.getElementById('f-lat').value=p.coords.latitude.toFixed(6);document.getElementById('f-lng').value=p.coords.longitude.toFixed(6);btn.disabled=false;setTxt('gpslbl',t('useGPS'));toast('GPS OK','ok')},()=>{btn.disabled=false;setTxt('gpslbl',t('useGPS'));toast(t('errGPS'),'err')})}
  async function upload(file){const ext=file.name.split('.').pop()||'jpg';const name=`${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;const {error}=await sb.storage.from('photos').upload(name,file,{contentType:file.type});if(error)throw error;return sb.storage.from('photos').getPublicUrl(name).data.publicUrl}
  async function doSave(){
    const name=document.getElementById('f-name').value.trim(),desc=document.getElementById('f-desc').value.trim()
    const lat=parseFloat(document.getElementById('f-lat').value),lng=parseFloat(document.getElementById('f-lng').value)
    const entrance=document.querySelector('[data-grp="ent"].on')?.dataset.val||'Medium'
    if(!name){toast(t('errName'),'err');return}
    if(isNaN(lat)||isNaN(lng)){toast(t('errCoords'),'err');return}
    const flags={};document.querySelectorAll('[data-flag]').forEach(b=>{if(b.dataset.flag!=='visited')flags[b.dataset.flag]=b.classList.contains('on')})
    const visitedVal=document.querySelector('[data-flag="visited"]').classList.contains('on')
    const btn=document.getElementById('fsv')
    const progress=document.getElementById('upload-progress')
    btn.disabled=true;btn.textContent=t('upl')
    progress.style.display='block';progress.value=0
    try{
      let thumbnailUrl=existingThumbUrl
      if(thumbFile){thumbnailUrl=await upload(thumbFile)}
      const photoUrls=[...existingPhotoUrls]
      const totalFiles=photoFiles.length
      for(let i=0;i<totalFiles;i++){
        const url=await upload(photoFiles[i])
        photoUrls.push(url)
        progress.value=Math.round(((i+1)/totalFiles)*100)
        btn.textContent=`${t('upl')} ${i+1}/${totalFiles}`
      }
      btn.textContent=t('saving')
      progress.value=100
      const payload={name,description:desc,latitude:lat,longitude:lng,entrance,thumbnail_url:thumbnailUrl,photos:photoUrls,visited:visitedVal,...flags}
      let error; if(editingId)({error}=await sb.from('spots').update(payload).eq('id',editingId)); else({error}=await sb.from('spots').insert(payload))
      if(error)throw error
      toast(t('saved'),'ok'); showListTab()
    }catch(e){
      toast(t('errSave')+': '+e.message,'err')
      btn.disabled=false; btn.textContent=t('save')
    }finally{
      progress.style.display='none'; progress.value=0
      btn.disabled=false; if(btn.textContent!==t('save'))btn.textContent=t('save')
    }
  }

  function openLB(url){document.getElementById('lb-img').src=url;document.getElementById('lb').classList.add('open')}
  function closeLB(){document.getElementById('lb').classList.remove('open')}
  document.getElementById('lb').addEventListener('click',e=>{if(e.target===e.currentTarget)closeLB()})

  function toast(msg,type=''){const el=document.getElementById('toast');el.textContent=msg;el.className='toast '+type+' show';clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),3000)}
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
</script>
</body>
